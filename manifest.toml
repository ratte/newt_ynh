#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "newt"
name = "Newt"
description.en = "Site connector that tunnels your YunoHost apps to a Pangolin reverse proxy"
description.fr = "Connecteur de site qui relie vos apps YunoHost à un reverse proxy Pangolin via un tunnel"
description.de = "Site-Connector, der deine YunoHost-Apps per Tunnel an einen Pangolin-Reverse-Proxy anbindet"

version = "1.20.1~ynh1"

maintainers = ["ratte"]

[upstream]
license = "AGPL-3.0-only"
website = "https://pangolin.net"
admindoc = "https://docs.pangolin.net/manage/sites/install-site"
code = "https://github.com/fosrl/newt"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "100M"
ram.build = "50M"
ram.runtime = "100M"

[install]
    [install.pangolin_endpoint]
    ask.en = "URL of your Pangolin server"
    ask.fr = "URL de votre serveur Pangolin"
    ask.de = "URL deines Pangolin-Servers"
    help.en = "Shown in Pangolin when you create a site (Sites > Add Site > Newt), e.g. https://pangolin.example.org"
    help.fr = "Affichée dans Pangolin lors de la création d'un site (Sites > Add Site > Newt), p. ex. https://pangolin.example.org"
    help.de = "Wird in Pangolin beim Anlegen einer Site angezeigt (Sites > Add Site > Newt), z. B. https://pangolin.example.org"
    type = "url"
    example = "https://pangolin.example.org"

    [install.newt_id]
    ask.en = "Newt ID"
    ask.fr = "ID Newt"
    ask.de = "Newt-ID"
    help.en = "The 'ID' value of the site you created in Pangolin"
    help.fr = "La valeur 'ID' du site créé dans Pangolin"
    help.de = "Der Wert 'ID' der in Pangolin angelegten Site"
    type = "string"
    pattern.regexp = '^[a-zA-Z0-9]+$'
    pattern.error = "Only letters and digits are allowed"

    [install.newt_secret]
    ask.en = "Newt secret"
    ask.fr = "Secret Newt"
    ask.de = "Newt-Secret"
    help.en = "The 'Secret' value of the site you created in Pangolin"
    help.fr = "La valeur 'Secret' du site créé dans Pangolin"
    help.de = "Der Wert 'Secret' der in Pangolin angelegten Site"
    type = "password"

    [install.log_level]
    ask.en = "Log level"
    ask.fr = "Niveau de journalisation"
    ask.de = "Log-Level"
    type = "select"
    choices = ["DEBUG", "INFO", "WARN", "ERROR"]
    default = "INFO"

[resources]
    [resources.sources.main]
    extract = false
    rename = "newt"

    amd64.url = "https://github.com/fosrl/newt/releases/download/1.20.1/newt_linux_amd64"
    amd64.sha256 = "ac5556844efa38308b54c474c2bb9c512ea13a1c584d0ee1fc9d7b6fee01ddbb"
    arm64.url = "https://github.com/fosrl/newt/releases/download/1.20.1/newt_linux_arm64"
    arm64.sha256 = "6a0e7c5775e4cfa1668e554ef2137722533fd7046c2be5495e7d01055c61f6b5"
    armhf.url = "https://github.com/fosrl/newt/releases/download/1.20.1/newt_linux_arm32"
    armhf.sha256 = "25561bd2ae2e477fdc20f05094f4bc47b180bf211eca52b70ad74a57bd86b155"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^newt_linux_amd64$"
    autoupdate.asset.arm64 = "^newt_linux_arm64$"
    autoupdate.asset.armhf = "^newt_linux_arm32$"

    [resources.system_user]

    [resources.install_dir]
    # The app user must not be able to write here: Newt has a built-in
    # self-updater, versions are managed by YunoHost instead.
    owner = "__APP__:rx"
    group = "__APP__:rx"
