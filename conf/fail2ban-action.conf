# Managed by the YunoHost Newt app.
# Behind Pangolin every request arrives through the tunnel from localhost,
# so firewall bans of the real client IP have no effect. This action bans
# the IP in nginx instead (deny rule in http context, after real_ip).
[Definition]
_reload = nginx -qt && systemctl reload nginx
actionstart = touch <banfile>
actionstop = truncate -s 0 <banfile>; %(_reload)s
actioncheck =
actionban = grep -qxF 'deny <ip>;' <banfile> || echo 'deny <ip>;' >> <banfile>; %(_reload)s
actionunban = grep -vxF 'deny <ip>;' <banfile> > <banfile>.tmp; cat <banfile>.tmp > <banfile>; rm -f <banfile>.tmp; %(_reload)s

[Init]
banfile = /etc/nginx/newt-banned-ips.conf
