# Managed by the YunoHost Newt app: additionally ban web clients in nginx,
# since they reach YunoHost through the Pangolin tunnel.
[yunohost]
action = %(action_)s
         newt-nginx-deny

[yunohost-portal]
action = %(action_)s
         newt-nginx-deny

[nginx-http-auth]
action = %(action_)s
         newt-nginx-deny

[recidive]
action = %(action_)s
         newt-nginx-deny
