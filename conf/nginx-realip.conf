# Managed by the YunoHost Newt app (real client IPs behind Pangolin).
# Newt delivers every request from localhost; Pangolin appends the real
# client IP to X-Forwarded-For. Only the last untrusted entry is used,
# so clients can't spoof it.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Clients banned by fail2ban (firewall bans can't work through the tunnel)
include /etc/nginx/newt-banned-ips.conf;
